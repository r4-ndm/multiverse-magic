# fly.toml app configuration file for Multiverse Magic
# See https://fly.io/docs/reference/configuration/ for information.

app = "multiverse-magic"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 400

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
